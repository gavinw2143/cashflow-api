services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cashflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      retries: 10

  flyway:
    image: flyway/flyway:13.10.3
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/cashflow
      FLYWAY_USER: cashflow
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    volumes:
      - ./migrations:/flyway/migrations:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
