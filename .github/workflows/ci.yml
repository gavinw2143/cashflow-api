name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_PASSWORD: ci-test-only
      TEST_DATABASE_URL: postgresql://cashflow:ci-test-only@127.0.0.1:5432/cashflow_test
      DATABASE_URL: postgresql://cashflow:ci-test-only@127.0.0.1:5432/cashflow_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Create test database
        run: |
          docker compose exec -T db \
            createdb -U cashflow cashflow_test

      - name: Apply Flyway migrations
        run: |
          docker compose run --rm \
            -e FLYWAY_URL=jdbc:postgresql://db:5432/cashflow_test \
            flyway migrate

      - name: Validate Flyway migrations
        run: |
          docker compose run --rm \
            -e FLYWAY_URL=jdbc:postgresql://db:5432/cashflow_test \
            flyway validate

      - name: Run tests
        run: uv run --no-sync pytest -q -ra

      - name: PostgreSQL logs on failure
        if: failure()
        run: docker compose logs db

      - name: Clean up
        if: always()
        run: docker compose down -v
